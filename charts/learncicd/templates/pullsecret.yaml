# yamllint disable rule:line-length
# SealedSecret voor Gitea registry-pull (namespace-scoped: default).
# Gegenereerd met kubeseal tegen de cluster-key; bevat geen plaintext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gitea-registry
  namespace: default
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: gitea-registry
      namespace: default
    type: kubernetes.io/dockerconfigjson
