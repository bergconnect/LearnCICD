apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learncicd-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bergconnect/LearnCICD.git
    targetRevision: HEAD
    path: .infra/learncicd
    helm:
      valueFiles:
        - $values/.infra/learncicd/values.yaml
        - $values/.infra/learncicd/values_dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
