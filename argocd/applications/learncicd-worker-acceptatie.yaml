apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learncicd-worker-acceptatie
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bergconnect/LearnCICD.git
    targetRevision: HEAD
    path: .infra/learncicd-worker
    helm:
      valueFiles:
        - $values/.infra/learncicd-worker/values.yaml
        - $values/.infra/learncicd-worker/values-acceptatie.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: acceptatie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
