name: CI template

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK-versie voor setup-dotnet'
        required: false
        default: '10.0.x'
        type: string

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.classify.outputs.projects }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        run: >
          FILES=$(git diff --name-only origin/main...HEAD);
          PROJECTS=$(ls src);
          SELECTED=""; WORKFLOWS=false; set -f;
          while IFS= read -r f; do
          MATCHED=false;
          case "$f" in
          global.json|version.json|*.sln|Directory.*)
          SELECTED="$PROJECTS"; MATCHED=true;;
          .github/workflows/ci.yml|.github/workflows/ci-template.yml)
          SELECTED="$PROJECTS"; MATCHED=true;;
          esac;
          if [ "$MATCHED" = false ]; then
          for P in $PROJECTS; do
          case "$f" in src/$P/**|tests/$P.Tests/**)
          case " $SELECTED " in *" $P "*) :;;
          *) SELECTED="$SELECTED $P";; esac;
          MATCHED=true; break;; esac; done; fi;
          if [ "$MATCHED" = false ]; then
          case "$f" in
          .github/*)
          WORKFLOWS=true;;
          .infra/*|argocd/*|docs/*|*.md|.gitignore|LICENSE)
          :;;
          *)
          SELECTED="$PROJECTS";;
          esac; fi;
          done <<< "$FILES";
          if [ -z "$SELECTED" ]; then JSON="[]";
          else JSON=$(printf '%s\n' $SELECTED | sort -u | jq -R . | jq -cs .);
          fi;
          echo "projects=$JSON" >> "$GITHUB_OUTPUT";
          echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: >
      needs.changes.outputs.projects != '' &&
      needs.changes.outputs.projects != '[]'
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: >
          dotnet build "src/$PROJECT/$PROJECT.csproj" -c Release
          --no-restore /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          -c Release --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.project }}
          path: "**/*.cobertura.xml"
          retention-days: 14

  security:
    name: Security
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: >
      needs.changes.outputs.projects != '' &&
      needs.changes.outputs.projects != '[]'
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: >
          dotnet list "src/$PROJECT/$PROJECT.csproj" package
          --vulnerable --include-transitive | tee audit.log;
          dotnet list "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          package --vulnerable --include-transitive | tee -a audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: >
          dotnet list "src/$PROJECT/$PROJECT.csproj" package
          --deprecated;
          dotnet list "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          package --deprecated

  verify:
    name: Verify
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [changes, test, security]
    if: always()
    steps:
      - name: Verify test and security results
        run: >
          for r in
          "${{ needs.changes.result }}"
          "${{ needs.test.result }}"
          "${{ needs.security.result }}";
          do case "$r" in success|skipped) :;;
          *) echo "::error::Unsatisfied result: $r"; exit 1;; esac;
          done
