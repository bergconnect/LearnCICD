name: CD template

on:
  workflow_call:
    secrets:
      GITEA_TOKEN:
        required: true
      GH_PAT:
        required: true

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed projects
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed projects
        id: discover
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: >
          FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null
          || git diff --name-only HEAD~1 HEAD);
          PROJECTS=$(ls src);
          SELECTED=""; set -f;
          while IFS= read -r f; do
          MATCHED=false;
          case "$f" in
          global.json|version.json|*.sln|Directory.*)
          SELECTED="$PROJECTS"; MATCHED=true;;
          .github/workflows/cd.yml|.github/workflows/cd-template.yml)
          SELECTED="$PROJECTS"; MATCHED=true;;
          esac;
          if [ "$MATCHED" = false ]; then
          for P in $PROJECTS; do
          case "$f" in src/$P/**)
          case " $SELECTED " in *" $P "*) :;;
          *) SELECTED="$SELECTED $P";; esac;
          MATCHED=true; break;; esac; done; fi;
          if [ "$MATCHED" = false ]; then
          case "$f" in
          src/*/**|tests/*|.github/*|charts/*|argocd/*)
          :;;
          docs/*|*.md|.gitignore|LICENSE)
          :;;
          *)
          SELECTED="$PROJECTS";;
          esac; fi;
          done <<< "$FILES";
          if [ -z "$FILES" ]; then SELECTED="$PROJECTS"; fi;
          MATRIX_JSON="[]";
          for P in $SELECTED; do
          case "$P" in
          Api) SUFFIX="learncicd"; BRANCH="ci/image-tag-update";;
          *) LOW=$(echo "$P" | tr '[:upper:]' '[:lower:]');
          SUFFIX="learncicd-$LOW"; BRANCH="ci/image-tag-update-$LOW";;
          esac;
          ITEM=$(jq -n --arg p "$P" --arg s "$SUFFIX" --arg b "$BRANCH"
          '{project:$p,suffix:$s,branch:$b}');
          MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --argjson i "$ITEM"
          '. + [$i]');
          done;
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish image
    runs-on: [self-hosted]
    needs: [detect]
    if: >
      needs.detect.outputs.matrix != '' &&
      needs.detect.outputs.matrix != '[]'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.release.project }}
      SUFFIX: ${{ matrix.release.suffix }}
      IMAGE_HOST: ${{ vars.GITEA_HOST }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        run: >
          VER=$(cd "src/$PROJECT" && dotnet nbgv get-version -v SemVer2);
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Version $VER for $PROJECT"

      - name: Build image archive with dotnet publish
        run: >
          dotnet publish "src/$PROJECT/$PROJECT.csproj"
          --os linux --arch x64
          -c Release
          -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0
          -p:ContainerRepository=$IMAGE_HOST/beheerder/$SUFFIX
          -p:ContainerImageTag=$VER
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=/tmp/image-$PROJECT.tar

      - name: Log in to Gitea registry
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: >
          mkdir -p "$XDG_RUNTIME_DIR";
          skopeo login --tls-verify=false
          --username ${{ vars.GITEA_USER }}
          --password ${{ secrets.GITEA_TOKEN }}
          ${{ vars.GITEA_LOCAL }}

      - name: Push version tag with Skopeo
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
          IMAGE: ${{ vars.GITEA_LOCAL }}/beheerder/${{ matrix.release.suffix }}
        run: >
          skopeo copy --tls-verify=false
          docker-archive:/tmp/image-$PROJECT.tar:$IMAGE:$VER
          docker://$IMAGE:$VER

  update-tag:
    name: Update image tag
    runs-on: [self-hosted]
    needs: [publish, detect]
    if: >
      always() &&
      needs.detect.outputs.matrix != '' &&
      needs.detect.outputs.matrix != '[]'
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.release.project }}
      SUFFIX: ${{ matrix.release.suffix }}
      BRANCH: ${{ matrix.release.branch }}
      IMAGE_HOST: ${{ vars.GITEA_HOST }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        run: >
          VER=$(cd "src/$PROJECT" && dotnet nbgv get-version -v SemVer2);
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Version $VER for $PROJECT"

      - name: Check published image exists
        id: gate
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: >
          mkdir -p "$XDG_RUNTIME_DIR";
          IMAGE="$IMAGE_HOST/beheerder/$SUFFIX";
          skopeo login --tls-verify=false
          --username ${{ vars.GITEA_USER }}
          --password ${{ secrets.GITEA_TOKEN }}
          ${{ vars.GITEA_LOCAL }} > /dev/null;
          if skopeo inspect --tls-verify=false --raw
          docker://$IMAGE:$VER > /dev/null 2>&1;
          then echo "proceed=true" >> "$GITHUB_OUTPUT";
          else echo "Image $IMAGE:$VER not published, skipping";
          echo "proceed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set image tag to published version
        if: steps.gate.outputs.proceed == 'true'
        run: >
          VALUES_FILE="charts/$SUFFIX/values-devtest.yaml";
          TAG="$VER"
          yq -i '.image.tag = strenv(TAG)' "$VALUES_FILE";
          echo "VALUES_FILE=$VALUES_FILE" >> "$GITHUB_ENV"

      - name: Commit and push tag update
        if: steps.gate.outputs.proceed == 'true'
        run: >
          VERSION="$VER";
          git config user.name "gitea-actions[bot]";
          git config user.email "gitea-actions[bot]@users.noreply.gitea";
          git switch -C "$BRANCH";
          git add "$VALUES_FILE";
          git commit -m "ci: update devtest image tag to $VERSION";
          git push --force origin "$BRANCH"

      - name: Open update PR
        id: open_pr
        if: steps.gate.outputs.proceed == 'true'
        env:
          TOKEN: ${{ secrets.GH_PAT }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: >
          VERSION="$VER";
          STATUS=$(curl -s -o response.json -w "%{http_code}"
          -X POST "$API/repos/$REPO/pulls"
          -H "Authorization: token $TOKEN"
          -H "Content-Type: application/json"
          -d "{\"title\":\"ci: update devtest image tag
          to $VERSION\",\"body\":\"Automated tag update
          for image published from
          ${{ github.sha }}.\",\"head\":\"$BRANCH\",\"base\":\"main\"}");
          cat response.json;
          if [ "$STATUS" != "201" ] && ! grep -q "already exists" response.json;
          then echo "::error::Failed to open PR (HTTP $STATUS)"; exit 1; fi;
          PR_NUMBER=$(jq -r '.number // empty' response.json);
          if [ -z "$PR_NUMBER" ]; then
          PR_NUMBER=$(curl -s -H "Authorization: token $TOKEN"
          "$API/repos/$REPO/pulls?state=open"
          | jq -r --arg BRANCH "$BRANCH"
          '.[] | select(.head.ref == $BRANCH) | .number' | head -n1); fi;
          if [ -z "$PR_NUMBER" ]; then
          echo "::error::PR number not found"; exit 1; fi;
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.proceed == 'true'
        env:
          TOKEN: ${{ secrets.GH_PAT }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: >
          PR_JSON=$(curl -s -H "Authorization: Bearer $TOKEN"
          "$API/repos/$REPO/pulls/$PR_NUMBER");
          if [ "$(echo "$PR_JSON" | jq -r '.auto_merge')" != "null" ];
          then echo "auto-merge al actief"; exit 0; fi;
          NODE=$(echo "$PR_JSON" | jq -r '.node_id');
          QUERY='mutation($id:ID!){enablePullRequestAutoMerge
          (input:{pullRequestId:$id,mergeMethod:MERGE})
          {pullRequest{number}}}';
          jq -n --arg q "$QUERY" --arg id "$NODE"
          '{query:$q,variables:{id:$id}}' > gql.json;
          RESP=$(curl -s -X POST -H "Authorization: Bearer $TOKEN"
          -H "Content-Type: application/json" "$API/graphql" -d @gql.json);
          echo "$RESP"; rm -f gql.json;
          if echo "$RESP" | jq -e '.errors' > /dev/null;
          then echo "::error::auto-merge inschakelen mislukt"; exit 1; fi
