name: CD template

on:
  workflow_call:
    inputs:
      registry-host:
        description: 'Registry-host voor image-referenties'
        required: false
        default: 'go.berg-connect.nl'
        type: string
      repository:
        description: 'Repository-namespace voor images'
        required: false
        default: 'beheerder'
        type: string
      base-image:
        description: 'Runtime base-image voor dotnet publish'
        required: false
        default: 'mcr.microsoft.com/dotnet/aspnet:10.0'
        type: string
      dotnet-version:
        description: '.NET SDK-versie voor setup-dotnet'
        required: false
        default: '10.0.x'
        type: string
    secrets:
      GITEA_TOKEN:
        required: true
      GH_PAT:
        required: true

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed projects
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed paths
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1 HEAD
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/detect-changed-projects
        with:
          files: ${{ steps.diff.outputs.files }}
          own-workflow-files: |
            .github/workflows/cd.yml
            .github/workflows/cd-template.yml
          match-tests: 'false'
          flag-workflow-changes: 'false'
          ignore-other-src-and-tests: 'true'
          select-all-on-empty-diff: 'true'

      - name: Build publish matrix
        id: build-matrix
        env:
          PROJECTS: ${{ steps.classify.outputs.projects }}
        run: >
          MATRIX_JSON="[]";
          for P in $(echo "$PROJECTS" | jq -r '.[]'); do
          IMAGE=$(jq -r --arg p "$P"
          '.[$p].image_name // empty' .github/projects.json);
          if [ -z "$IMAGE" ]; then
          echo "::error::$P ontbreekt in .github/projects.json"; exit 1; fi;
          ITEM=$(jq -n --arg p "$P" --arg i "$IMAGE"
          '{project:$p,image:$i}');
          MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --argjson i "$ITEM"
          '. + [$i]');
          done;
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish image
    runs-on: [self-hosted]
    needs: [detect]
    if: >
      needs.detect.outputs.matrix != '' &&
      needs.detect.outputs.matrix != '[]'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.release.project }}
      IMAGE_NAME: ${{ matrix.release.image }}
      REGISTRY: ${{ inputs.registry-host || 'go.berg-connect.nl' }}
      REPOSITORY: ${{ inputs.repository || 'beheerder' }}
      BASE_IMAGE: ${{ inputs.base-image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        run: >
          VER=$(cd "src/$PROJECT" && dotnet nbgv get-version -v SemVer2);
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Version $VER for $PROJECT"

      - name: Build image archive with dotnet publish
        run: >
          BASE_IMAGE="${BASE_IMAGE:-mcr.microsoft.com/dotnet/aspnet:10.0}";
          dotnet publish "src/$PROJECT/$PROJECT.csproj"
          --os linux --arch x64
          -c Release
          -p:ContainerBaseImage=$BASE_IMAGE
          -p:ContainerRepository=$REGISTRY/$REPOSITORY/$IMAGE_NAME
          -p:ContainerImageTag=$VER
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=/tmp/image-$PROJECT.tar

      - name: Push version tag with Skopeo
        run: >
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME";
          skopeo copy --tls-verify=false
          --dest-username ${{ vars.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          docker-archive:/tmp/image-$PROJECT.tar:$IMAGE:$VER
          docker://$IMAGE:$VER

  update-tag:
    name: Update image tag
    runs-on: [self-hosted]
    needs: [publish, detect]
    if: >
      always() &&
      needs.detect.outputs.matrix != '' &&
      needs.detect.outputs.matrix != '[]'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.release.project }}
      IMAGE_NAME: ${{ matrix.release.image }}
      REGISTRY: ${{ inputs.registry-host || 'go.berg-connect.nl' }}
      REPOSITORY: ${{ inputs.repository || 'beheerder' }}
      BASE_IMAGE: ${{ inputs.base-image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        run: >
          VER=$(cd "src/$PROJECT" && dotnet nbgv get-version -v SemVer2);
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Version $VER for $PROJECT"

      - name: Check published image exists
        id: gate
        run: >
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME";
          skopeo inspect --tls-verify=false --raw
          --creds "${{ vars.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}"
          docker://$IMAGE:$VER > /dev/null 2>&1
          && echo "proceed=true" >> "$GITHUB_OUTPUT"
          || echo "proceed=false" >> "$GITHUB_OUTPUT"

      - name: Bump devtest tag
        id: bump
        if: steps.gate.outputs.proceed == 'true'
        run: >
          CHART=$(jq -r --arg p "$PROJECT"
          '.[$p].chart // empty' .github/projects.json);
          if [ -z "$CHART" ]; then
          echo "::error::Onbekend project '$PROJECT'"; exit 1; fi;
          FILE=".infra/$CHART/values-devtest.yaml";
          TAG="$VER";
          CURRENT="$(yq '.image.tag' "$FILE")";
          if [ "$CURRENT" = "$TAG" ]; then
          echo "Tag al actueel — geen wijziging";
          echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi;
          yq -i '.image.tag = strenv(TAG)' "$FILE";
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push tag update
        id: commit
        if: steps.bump.outputs.changed == 'true'
        env:
          BRANCH: "ci/image-tag-update-${{ matrix.release.image }}"
        run: >
          FILE=".infra/$(jq -r --arg p "$PROJECT"
          '.[$p].chart // empty' .github/projects.json)/values-devtest.yaml";
          git config user.name "gitea-actions[bot]";
          git config user.email "gitea-actions[bot]@users.noreply.gitea";
          git switch -C "$BRANCH";
          git add "$FILE";
          git commit -m "ci: update $IMAGE_NAME devtest tag to $VER";
          git push --force origin "$BRANCH"

      - name: Open update PR
        id: open_pr
        if: steps.bump.outputs.changed == 'true'
        env:
          IMAGE_NAME: ${{ matrix.release.image }}
          BRANCH: "ci/image-tag-update-${{ matrix.release.image }}"
          TOKEN: ${{ secrets.GH_PAT }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: >
          STATUS=$(curl -s -o response.json -w "%{http_code}"
          -X POST "$API/repos/$REPO/pulls"
          -H "Authorization: token $TOKEN"
          -H "Content-Type: application/json"
          -d "{\"title\":\"ci: update image tag $IMAGE_NAME:$VER
          to devtest\",\"body\":\"Automated tag update
          for freshly published image
          ${{ github.sha }}.\",\"head\":\"$BRANCH\",\"base\":\"main\"}");
          cat response.json;
          if [ "$STATUS" != "201" ] && ! grep -q "already exists" response.json;
          then echo "::error::Failed to open PR (HTTP $STATUS)"; exit 1; fi;
          PR_NUMBER=$(jq -r '.number // empty' response.json);
          if [ -z "$PR_NUMBER" ]; then
          PR_NUMBER=$(curl -s -H "Authorization: token $TOKEN"
          "$API/repos/$REPO/pulls?state=open"
          | jq -r --arg BRANCH "$BRANCH"
          '.[] | select(.head.ref == $BRANCH) | .number' | head -n1); fi;
          if [ -z "$PR_NUMBER" ]; then
          echo "::error::PR number not found"; exit 1; fi;
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        env:
          TOKEN: ${{ secrets.GH_PAT }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: >
          PR_JSON=$(curl -s -H "Authorization: Bearer $TOKEN"
          "$API/repos/$REPO/pulls/$PR_NUMBER");
          if [ "$(echo "$PR_JSON" | jq -r '.auto_merge')" != "null" ];
          then echo "auto-merge al actief"; exit 0; fi;
          NODE=$(echo "$PR_JSON" | jq -r '.node_id');
          QUERY='mutation($id:ID!){enablePullRequestAutoMerge
          (input:{pullRequestId:$id,mergeMethod:MERGE})
          {pullRequest{number}}}';
          jq -n --arg q "$QUERY" --arg id "$NODE"
          '{query:$q,variables:{id:$id}}' > gql.json;
          RESP=$(curl -s -X POST -H "Authorization: Bearer $TOKEN"
          -H "Content-Type: application/json" "$API/graphql" -d @gql.json);
          echo "$RESP"; rm -f gql.json;
          if echo "$RESP" | jq -e '.errors' > /dev/null;
          then echo "::error::auto-merge inschakelen mislukt"; exit 1; fi
