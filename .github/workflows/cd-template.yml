name: CD template

on:
  workflow_call:
    inputs:
      api-image:
        description: 'Volledige image-naam voor het Api-project'
        required: false
        default: 'beheerder/learncicd'
        type: string
      image-prefix:
        description: 'Prefix voor overige project-images (<prefix>-<klein>)'
        required: false
        default: 'beheerder/learncicd'
        type: string
    secrets:
      GITEA_TOKEN:
        required: true

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed projects
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed projects
        id: discover
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          API_IMAGE: ${{ inputs.api-image }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
        run: >
          API_IMAGE="${API_IMAGE:-beheerder/learncicd}";
          IMAGE_PREFIX="${IMAGE_PREFIX:-beheerder/learncicd}";
          FILES=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null
          || git diff --name-only HEAD~1 HEAD);
          PROJECTS=$(ls src);
          SELECTED=""; set -f;
          while IFS= read -r f; do
          MATCHED=false;
          case "$f" in
          global.json|version.json|*.sln|Directory.*)
          SELECTED="$PROJECTS"; MATCHED=true;;
          .github/workflows/cd.yml|.github/workflows/cd-template.yml)
          SELECTED="$PROJECTS"; MATCHED=true;;
          esac;
          if [ "$MATCHED" = false ]; then
          for P in $PROJECTS; do
          case "$f" in src/$P/**)
          case " $SELECTED " in *" $P "*) :;;
          *) SELECTED="$SELECTED $P";; esac;
          MATCHED=true; break;; esac; done; fi;
          if [ "$MATCHED" = false ]; then
          case "$f" in
          src/*/**|tests/*|.github/*|charts/*|argocd/*)
          :;;
          docs/*|*.md|.gitignore|LICENSE)
          :;;
          *)
          SELECTED="$PROJECTS";;
          esac; fi;
          done <<< "$FILES";
          if [ -z "$FILES" ]; then SELECTED="$PROJECTS"; fi;
          MATRIX_JSON="[]";
          for P in $SELECTED; do
          case "$P" in
          Api) IMAGE="$API_IMAGE";;
          *) LOW=$(echo "$P" | tr '[:upper:]' '[:lower:]');
          IMAGE="$IMAGE_PREFIX-$LOW";;
          esac;
          ITEM=$(jq -n --arg p "$P" --arg i "$IMAGE"
          '{project:$p,image:$i}');
          MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c --argjson i "$ITEM"
          '. + [$i]');
          done;
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish image
    runs-on: [self-hosted]
    needs: [detect]
    if: >
      needs.detect.outputs.matrix != '' &&
      needs.detect.outputs.matrix != '[]'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.detect.outputs.matrix) }}
    env:
      PROJECT: ${{ matrix.release.project }}
      IMAGE_REPO: ${{ matrix.release.image }}
      IMAGE_HOST: ${{ vars.GITEA_HOST }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        run: >
          VER=$(cd "src/$PROJECT" && dotnet nbgv get-version -v SemVer2);
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Version $VER for $PROJECT"

      - name: Build image archive with dotnet publish
        run: >
          dotnet publish "src/$PROJECT/$PROJECT.csproj"
          --os linux --arch x64
          -c Release
          -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0
          -p:ContainerRepository=$IMAGE_HOST/$IMAGE_REPO
          -p:ContainerImageTag=$VER
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=/tmp/image-$PROJECT.tar

      - name: Log in to Gitea registry
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: >
          mkdir -p "$XDG_RUNTIME_DIR";
          skopeo login
          --username ${{ vars.GITEA_USER }}
          --password ${{ secrets.GITEA_TOKEN }}
          ${{ vars.GITEA_HOST }}

      - name: Push version tag with Skopeo
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/runtime
          IMAGE: ${{ vars.GITEA_HOST }}/${{ matrix.release.image }}
        run: >
          skopeo copy
          docker-archive:/tmp/image-$PROJECT.tar:$IMAGE:$VER
          docker://$IMAGE:$VER
