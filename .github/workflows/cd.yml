name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '.infra/**'
      - 'argocd/**'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      project:
        description: >
          Project-key uit .github/projects.json (geen choice:
          groeit mee)
        required: true
        type: string
      environment:
        description: 'Doelomgeving'
        required: true
        type: choice
        options: [devtest, productie]
      version:
        description: 'Image-versie (SemVer2, bv. 0.1.77)'
        required: true
        type: string

permissions: {}

# NOTE: no concurrency block here on purpose. A top-level concurrency
# block on a caller workflow prevents GitHub from expanding reusable
# workflow jobs (run fails instantly with 0 jobs, no error surfaced).
# The template keeps its own concurrency block (proven harmless).

jobs:
  cd:
    uses: bergconnect/cicd-workflows/.github/workflows/cd-template.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      registry-host: ${{ vars.GITEA_LOCAL }}
      repository: beheerder
      base-image: mcr.microsoft.com/dotnet/aspnet:10.0
      dotnet-version: 10.0.x
      dispatch-project: ${{ inputs.project }}
      dispatch-environment: ${{ inputs.environment }}
      dispatch-version: ${{ inputs.version }}
    secrets: inherit
