name: Preview template

on:
  workflow_call:
    inputs:
      project:
        description: 'Project-key uit .github/projects.json, of all'
        required: true
        type: string
      branch:
        description: 'Te deployen branch (leeg = branch van de dispatch)'
        required: false
        default: ''
        type: string
    secrets:
      GH_PAT:
        required: true
      GITEA_TOKEN:
        required: true
      BOT_GPG_PRIVATE_KEY:
        required: true

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  PREVIEW_BRANCH: ci/preview

permissions: {}

concurrency:
  group: preview-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve branch and projects
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.resolve.outputs.projects }}
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Resolve branch and projects
        id: resolve
        env:
          PROJECT: ${{ inputs.project }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: >
          KEYS=$(jq -c '[keys[] | select(. != "_global")]'
          .github/projects.json);
          if [ "$PROJECT" = "all" ]; then LIST="$KEYS";
          else echo "$KEYS" | jq -e --arg p "$PROJECT" 'index($p) != null'
          > /dev/null ||
          { echo "::error::Onbekend project '$PROJECT'"; exit 1; };
          LIST=$(jq -cn --arg p "$PROJECT" '[$p]'); fi;
          echo "projects=$LIST" >> "$GITHUB_OUTPUT";
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT";
          echo "Preview van $BRANCH voor $LIST"

  build:
    name: Build preview image
    runs-on: [self-hosted]
    needs: [resolve]
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.resolve.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - name: Set up .NET
        uses: ./.github/actions/dotnet-setup
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          restore-tools: 'true'

      - name: Map project to image
        run: >
          IMAGE=$(jq -r --arg p "$PROJECT"
          '.[$p].image_name // empty'
          .github/projects.json);
          [ -n "$IMAGE" ] ||
          { echo "::error::$PROJECT ontbreekt in
          .github/projects.json"; exit 1; };
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"

      - name: Version from feature branch
        run: >
          unset GITHUB_REF;
          TAG=$(cd "src/$PROJECT" &&
          dotnet nbgv get-version -v SemVer2);
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-g[0-9a-f]+$ ]] ||
          { echo "::error::onverwachte preview-versievorm: '$TAG'
          (main is geen preview-branch)"; exit 1; };
          echo "TAG=$TAG" >> "$GITHUB_ENV";
          echo "Preview tag $TAG for $PROJECT"

      - name: Build image archive with dotnet publish
        run: >
          unset GITHUB_REF;
          dotnet publish "src/$PROJECT/$PROJECT.csproj"
          --os linux --arch x64
          -c Release
          -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0
          -p:ContainerRepository=$REGISTRY/$REPOSITORY/$IMAGE_NAME
          -p:ContainerImageTag=$TAG
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=/tmp/image-$PROJECT-pr.tar
        env:
          REGISTRY: ${{ vars.GITEA_LOCAL }}
          REPOSITORY: ${{ vars.GITEA_SOURCE_REPOSITORY }}

      - name: Push preview tag with Skopeo
        run: >
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME";
          skopeo copy --dest-tls-verify=false
          --dest-creds "$DST_CREDS"
          docker-archive:/tmp/image-$PROJECT-pr.tar:$IMAGE:$TAG
          docker://$IMAGE:$TAG
        env:
          REGISTRY: ${{ vars.GITEA_LOCAL }}
          REPOSITORY: ${{ vars.GITEA_SOURCE_REPOSITORY }}
          DST_CREDS: ${{ vars.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}

  publish-branch:
    name: Publish preview branch
    runs-on: [self-hosted]
    needs: [resolve, build]
    environment: dev
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Set up .NET
        uses: ./.github/actions/dotnet-setup
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          restore-tools: 'true'

      - name: Import signing key
        env:
          GPG_KEY: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ vars.BOT_GPG_KEYID }}
        run: >
          echo "$GPG_KEY" | gpg --batch --import;
          git config user.signingkey "$KEY_ID";
          git config commit.gpgsign true;
          [ "$(git config commit.gpgsign)" = "true" ] ||
          { echo "::error::gpgsign niet actief"; exit 1; };
          [ -n "$(git config user.signingkey)" ] ||
          { echo "::error::signingkey leeg"; exit 1; };
          echo "Signing geconfigureerd"

      - name: Bump tags and push preview branch
        env:
          PROJECTS: ${{ needs.resolve.outputs.projects }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: >
          unset GITHUB_REF;
          git config user.name "gitea-actions[bot]";
          git config user.email "128380454+bergconnect@users.noreply.github.com";
          SUMMARY="";
          for P in $(echo "$PROJECTS" | jq -r '.[]'); do
          TAG=$(cd "src/$P" && dotnet nbgv get-version -v SemVer2);
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-g[0-9a-f]+$ ]] ||
          { echo "::error::onverwachte preview-versievorm voor $P: '$TAG'";
          exit 1; };
          CHART=$(jq -r --arg p "$P" '.[$p].chart // empty'
          .github/projects.json);
          [ -n "$CHART" ] ||
          { echo "::error::$P ontbreekt in .github/projects.json"; exit 1; };
          export TAG;
          yq -i '.image.tag = strenv(TAG)' ".infra/$CHART/values_dev.yaml";
          SUMMARY="$SUMMARY $P=$TAG"; done;
          git branch -D "$PREVIEW_BRANCH" > /dev/null 2>&1 || true;
          git checkout --orphan "$PREVIEW_BRANCH" &&
          git rm -rf --cached -q . &&
          git add -- .infra;
          git commit -m "ci: preview$SUMMARY to dev (branch: $BRANCH)";
          git push --force origin "$PREVIEW_BRANCH";
          echo "Preview branch $PREVIEW_BRANCH:$SUMMARY"