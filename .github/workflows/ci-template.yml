name: CI template

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET SDK-versie voor setup-dotnet'
        required: false
        default: '10.0.x'
        type: string
      api-paths:
        description: 'Spatiegescheiden globs die als Api-code tellen'
        required: false
        default: 'src/Api/** tests/Api.Tests/**'
        type: string
      worker-paths:
        description: 'Spatiegescheiden globs die als Worker-code tellen'
        required: false
        default: 'src/Worker/** tests/Worker.Tests/**'
        type: string

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      api: ${{ steps.classify.outputs.api }}
      worker: ${{ steps.classify.outputs.worker }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          API_PATHS: ${{ inputs.api-paths }}
          WORKER_PATHS: ${{ inputs.worker-paths }}
        run: >
          API_PATHS="${API_PATHS:-src/Api/** tests/Api.Tests/**}";
          WORKER_PATHS="${WORKER_PATHS:-src/Worker/**
          tests/Worker.Tests/**}";
          FILES=$(git diff --name-only origin/main...HEAD);
          API=false; WORKER=false; WORKFLOWS=false; set -f;
          while IFS= read -r f; do
          MATCHED=false;
          case "$f" in
          global.json|version.json|*.sln|Directory.*)
          API=true; WORKER=true; MATCHED=true;;
          .github/workflows/ci.yml|.github/workflows/ci-template.yml)
          API=true; WORKER=true; MATCHED=true;;
          esac;
          if [ "$MATCHED" = false ]; then
          for p in $API_PATHS; do
          case "$f" in $p)
          API=true; MATCHED=true; break;; esac; done; fi;
          if [ "$MATCHED" = false ]; then
          for p in $WORKER_PATHS; do
          case "$f" in $p)
          WORKER=true; MATCHED=true; break;; esac; done; fi;
          if [ "$MATCHED" = false ]; then
          case "$f" in
          .github/*)
          WORKFLOWS=true;;
          charts/*|argocd/*|docs/*|*.md|.gitignore|LICENSE)
          :;;
          *)
          API=true; WORKER=true;;
          esac; fi;
          done <<< "$FILES";
          echo "api=$API" >> "$GITHUB_OUTPUT";
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT";
          echo "workflows=$WORKFLOWS" >> "$GITHUB_OUTPUT"

  test-api:
    name: Test Api
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Api (Release)
        run: >
          dotnet build src/Api/Api.csproj -c Release --no-restore
          /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test tests/Api.Tests/Api.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-api
          path: "**/*.cobertura.xml"
          retention-days: 14

  test-worker:
    name: Test Worker
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Worker (Release)
        run: >
          dotnet build src/Worker/Worker.csproj -c Release --no-restore
          /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test tests/Worker.Tests/Worker.Tests.csproj -c Release
          --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-worker
          path: "**/*.cobertura.xml"
          retention-days: 14

  security-api:
    name: Security Api
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: >
          dotnet list src/Api/Api.csproj package --vulnerable
          --include-transitive | tee audit.log;
          dotnet list tests/Api.Tests/Api.Tests.csproj package
          --vulnerable --include-transitive | tee -a audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: >
          dotnet list src/Api/Api.csproj package --deprecated;
          dotnet list tests/Api.Tests/Api.Tests.csproj package
          --deprecated

  security-worker:
    name: Security Worker
    runs-on: [self-hosted]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version || '10.0.x' }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: >
          dotnet list src/Worker/Worker.csproj package --vulnerable
          --include-transitive | tee audit.log;
          dotnet list tests/Worker.Tests/Worker.Tests.csproj package
          --vulnerable --include-transitive | tee -a audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: >
          dotnet list src/Worker/Worker.csproj package --deprecated;
          dotnet list tests/Worker.Tests/Worker.Tests.csproj package
          --deprecated
