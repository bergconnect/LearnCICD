name: CI template
# LESSEN (niet verwijderen bij refactor):
# - run: > (NOOIT run: | met multi-line $(...): newline = scheiding, exit 127)
# - Geen top-level concurrency op callers; inputs-defaults; matrix-guards.
# - Composites erven geen secrets; export voor strenv(); yq -r; diff-guards.
# - SDK-versiebron = global.json (enige bron; geen dotnet-version-inputs).

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true
      GITEA_TOKEN:
        required: true
      BOT_GPG_PRIVATE_KEY:
        required: true

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change detection
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.classify.outputs.projects }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed paths
        id: diff
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only origin/main...HEAD
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/detect-changed-projects
        with:
          files: ${{ steps.diff.outputs.files }}
          match-tests: 'true'

      - name: Validate unique project versions
        run: >
          DUP=$(grep -h '"version"' src/*/version.json
          | sort | uniq -d);
          if [ -n "$DUP" ]; then
          echo "::error::Gedeelde major.minor-versies: $DUP";
          echo "Elk project vereist een uniek major.minor-nummer";
          exit 1; fi;
          echo "Projectversies uniek"

  verify-project:
    name: Verify
    runs-on: [self-hosted]
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [changes]
    if: >
      needs.changes.outputs.projects != '' &&
      needs.changes.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - name: Set up .NET
        uses: ./.github/actions/dotnet-setup
        with:
          token: ${{ github.token }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: >
          dotnet build "src/$PROJECT/$PROJECT.csproj" -c Release
          --no-restore /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          -c Release --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.project }}
          path: "**/*.cobertura.xml"
          retention-days: 14

      - name: Check for vulnerable packages
        run: >
          set -o pipefail;
          dotnet list "src/$PROJECT/$PROJECT.csproj" package
          --vulnerable --include-transitive | tee audit.log;
          dotnet list "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          package --vulnerable --include-transitive | tee -a audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: >
          dotnet list "src/$PROJECT/$PROJECT.csproj" package
          --deprecated;
          dotnet list "tests/$PROJECT.Tests/$PROJECT.Tests.csproj"
          package --deprecated

  verify:
    name: Verify
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [changes, verify-project]
    if: always()
    steps:
      - name: Verify test and security results
        run: >
          for r in
          "${{ needs.changes.result }}"
          "${{ needs.verify-project.result }}";
          do case "$r" in success|skipped) :;;
          *) echo "::error::Unsatisfied result: $r"; exit 1;; esac;
          done

  preview:
    name: Preview to dev
    runs-on: [self-hosted]
    needs: [changes, verify-project, verify]
    environment: dev
    if: >
      always() &&
      needs.verify.result == 'success' &&
      needs.changes.outputs.projects != '' &&
      needs.changes.outputs.projects != '[]'
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - name: Set up .NET
        uses: ./.github/actions/dotnet-setup
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          restore-tools: 'true'

      - name: Map project to image
        run: >
          IMAGE=$(jq -r --arg p "$PROJECT"
          '.[$p].image_name // empty'
          .github/projects.json);
          [ -n "$IMAGE" ] ||
          { echo "::error::$PROJECT ontbreekt in
          .github/projects.json"; exit 1; };
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"

      - name: Base version from origin/main
        run: >
          git fetch origin main:refs/remotes/origin/main;
          rm -rf /tmp/nbgvmain;
          git worktree add /tmp/nbgvmain origin/main;
          VER=$(dotnet nbgv get-version -v SemVer2
          --project /tmp/nbgvmain/src/$PROJECT 2>/dev/null ||
          (cd /tmp/nbgvmain/src/$PROJECT &&
          dotnet nbgv get-version -v SemVer2));
          git worktree remove --force /tmp/nbgvmain;
          VER=$(echo "$VER" | cut -d'-' -f1 | cut -d'+' -f1);
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
          { echo "::error::geen schone base-versie: '$VER'";
          exit 1; };
          echo "VER=$VER" >> "$GITHUB_ENV";
          echo "Base version $VER for $PROJECT"

      - name: Build image archive with dotnet publish
        run: >
          dotnet publish "src/$PROJECT/$PROJECT.csproj"
          --os linux --arch x64
          -c Release
          -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0
          -p:ContainerRepository=$REGISTRY/$REPOSITORY/$IMAGE_NAME
          -p:ContainerImageTag=$VER
          /t:PublishContainer
          -p:ContainerArchiveOutputPath=/tmp/image-$PROJECT-pr.tar
        env:
          REGISTRY: ${{ vars.GITEA_LOCAL }}
          REPOSITORY: ${{ vars.GITEA_SOURCE_REPOSITORY }}

      - name: Push base tag with Skopeo
        run: >
          IMAGE="$REGISTRY/$REPOSITORY/$IMAGE_NAME";
          skopeo copy --tls-verify=false
          --dest-username ${{ vars.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          docker-archive:/tmp/image-$PROJECT-pr.tar:$IMAGE:$VER
          docker://$IMAGE:$VER
        env:
          REGISTRY: ${{ vars.GITEA_LOCAL }}
          REPOSITORY: ${{ vars.GITEA_SOURCE_REPOSITORY }}

      - name: Bump dev tag via composite
        uses: ./.github/actions/bump-image-tag
        with:
          project: ${{ env.PROJECT }}
          env-name: dev
          version: ${{ env.VER }}
          image-name: ${{ env.IMAGE_NAME }}
          branch: ci/preview-${{ env.PROJECT }}-${{ env.VER }}
          commit-message: "ci: preview ${{ env.PROJECT }} \
            ${{ env.VER }} to dev"
          pr-title: "ci: preview ${{ env.PROJECT }} \
            ${{ env.VER }} to dev"
          pr-body: Automated PR preview of validated image
            ${{ env.VER }} to dev.
          token: ${{ secrets.GH_PAT }}
          gpg-key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          key-id: ${{ vars.BOT_GPG_KEYID }}
