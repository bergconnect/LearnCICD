name: Promote

run-name: Promote ${{ inputs.environment }} to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: >
          Project-naam. Moet als key voorkomen in
          .github/projects.json — voeg daar een nieuw project aan toe
          in plaats van deze workflow te wijzigen.
        required: true
        default: 'Api'
        type: choice
        options: [Api, Worker]
      environment:
        description: 'Doelomgeving'
        required: true
        type: choice
        options: [devtest, acceptatie, productie]
      version:
        description: 'Image-versie (SemVer2, bv. 0.1.77)'
        required: true
        type: string

permissions: {}

concurrency:
  group: promote-${{ inputs.project }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      chart: ${{ steps.check.outputs.chart }}
      image-name: ${{ steps.check.outputs.image-name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check version exists as image tag
        id: check
        env:
          PROJECT: ${{ inputs.project }}
          GITEA_USER: ${{ vars.GITEA_USER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: >
          MANIFEST=".github/projects.json";
          if [ ! -f "$MANIFEST" ]; then
          echo "::error::Manifest $MANIFEST ontbreekt"; exit 1; fi;
          IMAGE_NAME=$(jq -r --arg p "$PROJECT"
          '.[$p].image_name // empty' "$MANIFEST");
          CHART=$(jq -r --arg p "$PROJECT"
          '.[$p].chart // empty' "$MANIFEST");
          if [ -z "$IMAGE_NAME" ] || [ -z "$CHART" ]; then
          echo "::error::Onbekend project '$PROJECT' — voeg een entry toe
          aan $MANIFEST"; exit 1; fi;
          IMAGE="${{ vars.GITEA_LOCAL }}/beheerder/$IMAGE_NAME";
          VERSION="${{ inputs.version }}";
          case "$VERSION" in ''|*[!0-9.]*)
          echo "::error::Ongeldige version-input '$VERSION'
          (alleen cijfers en punten)"; exit 1;; esac;
          skopeo inspect --tls-verify=false --raw
          --creds "$GITEA_USER:$GITEA_TOKEN"
          docker://$IMAGE:$VERSION > /dev/null
          || { echo "::error::Image-tag $VERSION bestaat niet
          in $IMAGE"; exit 1; };
          echo "version=$VERSION" >> "$GITHUB_OUTPUT";
          echo "chart=$CHART" >> "$GITHUB_OUTPUT";
          echo "image-name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote ${{ inputs.environment }} to ${{ inputs.version }}
    runs-on: [self-hosted]
    needs: [validate]
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Promote tag via composite
        id: promote
        uses: ./.github/actions/bump-image-tag
        with:
          project: ${{ inputs.project }}
          env-name: ${{ inputs.environment }}
          version: ${{ needs.validate.outputs.version }}
          image-name: ${{ needs.validate.outputs.image-name }}
          branch: "ci/promote-${{ inputs.project }}-\
            ${{ inputs.environment }}-\
            ${{ needs.validate.outputs.version }}"
          commit-message: "ci: promote ${{ inputs.environment }} \
            to ${{ needs.validate.outputs.version }}"
          pr-title: "ci: promote ${{ inputs.project }} \
            ${{ inputs.environment }} to \
            ${{ needs.validate.outputs.version }}"
          pr-body: Promotie van image
            ${{ needs.validate.outputs.version }} naar
            ${{ inputs.environment }} (handmatig, sequentie gecontroleerd).
          token: ${{ secrets.GH_PAT }}
          require-sequence: ${{ inputs.environment == 'productie' }}
