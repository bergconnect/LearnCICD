name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - charts/learncicd/values.yaml

env:
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (.NET)
    runs-on: [self-hosted]
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/*.cobertura.xml"
          retention-days: 14

  version:
    name: Version
    runs-on: [self-hosted]
    if: github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      semVer: ${{ steps.version_step.outputs.semVer }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Determine version
        id: version_step
        run: >
          echo "semVer=$(dotnet nbgv get-version -v SemVer2)"
          >> "$GITHUB_OUTPUT"

      - name: Display version
        run: echo "Version ${{ steps.version_step.outputs.semVer }}"

  security:
    name: Security scan
    runs-on: [self-hosted]
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: >
          dotnet list package --vulnerable --include-transitive
          | tee audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: dotnet list package --deprecated

  publish:
    name: Publish image
    runs-on: [self-hosted]
    if: github.event_name == 'push'
    needs: [version]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.GITEA_HOST }}/beheerder/learncicd
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to OCI layout
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.semVer }}
            ${{ env.IMAGE }}:latest
          outputs: type=oci,dest=/tmp/image.tar

      - name: Push version tag with Skopeo
        run: >
          skopeo copy
          --dest-username ${{ secrets.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          oci-archive:/tmp/image.tar:${{ needs.version.outputs.semVer }}
          docker://${{ env.IMAGE }}:${{ needs.version.outputs.semVer }}

      - name: Push latest tag with Skopeo
        run: >
          skopeo copy
          --dest-username ${{ secrets.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          oci-archive:/tmp/image.tar:latest
          docker://${{ env.IMAGE }}:latest

  update-image-tag:
    name: Update image tag
    runs-on: [self-hosted]
    if: github.event_name == 'push'
    needs: [publish, version]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set image tag to published version
        run: >
          TAG="${{ needs.version.outputs.semVer }}"
          yq -i '.image.tag = strenv(TAG)' charts/learncicd/values.yaml

      - name: Commit and push tag update
        env:
          BRANCH: ci/image-tag-update
        run: >
          VERSION="${{ needs.version.outputs.semVer }}";
          git config user.name "gitea-actions[bot]";
          git config user.email "gitea-actions[bot]@users.noreply.gitea";
          git switch -C "$BRANCH";
          git add charts/learncicd/values.yaml;
          git commit -m "ci: update image tag to $VERSION";
          git push --force origin "$BRANCH"

      - name: Open update PR via API
        env:
          BRANCH: ci/image-tag-update
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          VERSION="${{ needs.version.outputs.semVer }}";
          STATUS=$(curl -s -o response.json -w "%{http_code}"
          -X POST "${{ github.api_url }}/repos/${{ github.repository }}/pulls"
          -H "Authorization: token $TOKEN"
          -H "Content-Type: application/json"
          -d "{\"title\":\"ci: update image tag
          to $VERSION\",\"body\":\"Automated tag update
          for image published from
          ${{ github.sha }}.\",\"head\":\"$BRANCH\",\"base\":\"main\"}");
          cat response.json;
          if [ "$STATUS" != "201" ] && ! grep -q "already exists" response.json;
          then echo "::error::Failed to open PR (HTTP $STATUS)"; exit 1; fi
