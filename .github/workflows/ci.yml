name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (.NET)
    runs-on: [self-hosted]
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --coverage --coverage-output-format cobertura

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/*.cobertura.xml"

  version:
    name: Version
    runs-on: [self-hosted]
    outputs:
      semVer: ${{ steps.version_step.outputs.semVer }}
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: version_step
        uses: gittools/actions/gitversion/execute@v4

      - name: Display version
        run: >
          echo "Version ${{ steps.version_step.outputs.semVer }}
          (full: ${{ steps.version_step.outputs.fullSemVer }})"

  security:
    name: Security scan
    runs-on: [self-hosted]
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: >
          dotnet list package --vulnerable --include-transitive
          | tee audit.log;
          if grep -q "has the following vulnerable packages" audit.log;
          then echo "::error::Vulnerable NuGet packages found";
          exit 1; fi;
          rm -f audit.log

      - name: Report deprecated packages
        run: dotnet list package --deprecated

  publish:
    name: Publish image
    runs-on: [self-hosted]
    if: github.event_name == 'push'
    needs: [test, version]
    env:
      IMAGE: ${{ secrets.GITEA_HOST }}/beheerder/learncicd
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image to OCI layout
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.semVer }}
            ${{ env.IMAGE }}:latest
          outputs: type=oci,dest=/tmp/image.tar

      - name: Push version tag with Skopeo
        run: >
          skopeo copy
          --dest-username ${{ secrets.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          oci-archive:/tmp/image.tar:${{ needs.version.outputs.semVer }}
          docker://${{ env.IMAGE }}:${{ needs.version.outputs.semVer }}

      - name: Push latest tag with Skopeo
        run: >
          skopeo copy
          --dest-username ${{ secrets.GITEA_USER }}
          --dest-password ${{ secrets.GITEA_TOKEN }}
          oci-archive:/tmp/image.tar:latest
          docker://${{ env.IMAGE }}:latest
