name: 'Setup .NET with tools'
description: >
  Checkout, .NET SDK-setup en (optioneel) tool-restore. Eén preambule
  voor alle CI/CD-legs in plaats van herhaalde drietallen steps.
inputs:
  dotnet-version:
    description: '.NET SDK-versie'
    required: false
    default: '10.0.x'
  fetch-depth:
    description: 'Checkout-diepte (0 = volledig, nodig voor nbgv)'
    required: false
    default: '1'
  token:
    description: 'Checkout-token, expliciet (composites erven geen secrets)'
    required: true
  restore-tools:
    description: "'true' draait ook dotnet tool restore"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.token }}
        fetch-depth: ${{ inputs.fetch-depth }}
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Restore .NET tools
      if: ${{ inputs.restore-tools == 'true' }}
      shell: bash
      run: dotnet tool restore
